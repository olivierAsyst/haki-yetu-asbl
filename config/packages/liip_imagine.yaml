# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    filter_sets:
        # Small thumbnails for home page
        thumbnail:
            quality: 85
            filters:
                thumbnail:
                    size: [400, 300]
                    mode: outbound
                    allow_upscale: true

        # Medium images for listings
        medium:
            quality: 85
            filters:
                thumbnail:
                    size: [800, 600]
                    mode: outbound
                    allow_upscale: true

        # Large images for lightbox
        large:
            quality: 90
            filters:
                thumbnail:
                    size: [1920, 1080]
                    mode: inset
                    allow_upscale: false
