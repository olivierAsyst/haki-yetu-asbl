vich_uploader:
    db_driver: orm

    mappings:
        activite_images:
            uri_prefix: /uploads/activites
            upload_destination: '%kernel.project_dir%/public/uploads/activites'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        album_images:
            uri_prefix: /uploads/albums
            upload_destination: '%kernel.project_dir%/public/uploads/albums'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        offre_emploi_files:
            uri_prefix: /uploads/offres
            upload_destination: '%kernel.project_dir%/public/uploads/offres'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        candidature_cv:
            uri_prefix: /uploads/candidatures/cv
            upload_destination: '%kernel.project_dir%/public/uploads/candidatures/cv'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        candidature_lettre:
            uri_prefix: /uploads/candidatures/lettres
            upload_destination: '%kernel.project_dir%/public/uploads/candidatures/lettres'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        candidature_autres:
            uri_prefix: /uploads/candidatures/autres
            upload_destination: '%kernel.project_dir%/public/uploads/candidatures/autres'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
