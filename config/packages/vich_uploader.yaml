vich_uploader:
    db_driver: orm

    mappings:
        activite_images:
            uri_prefix: /uploads/activites
            upload_destination: '%kernel.project_dir%/public/uploads/activites'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        album_images:
            uri_prefix: /uploads/albums
            upload_destination: '%kernel.project_dir%/public/uploads/albums'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        offre_emploi_files:
            uri_prefix: /uploads/offres
            upload_destination: '%kernel.project_dir%/public/uploads/offres'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        # Documents des candidats : données personnelles, stockées HORS de public/.
        # Ils ne sont accessibles que via le back-office (CandidatureCrudController::telecharger).
        # Pensez à sauvegarder var/uploads/ en production.
        candidature_cv:
            uri_prefix: /admin/candidature-fichier/cv
            upload_destination: '%kernel.project_dir%/var/uploads/candidatures/cv'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        candidature_lettre:
            uri_prefix: /admin/candidature-fichier/lettre
            upload_destination: '%kernel.project_dir%/var/uploads/candidatures/lettres'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        candidature_autres:
            uri_prefix: /admin/candidature-fichier/autres
            upload_destination: '%kernel.project_dir%/var/uploads/candidatures/autres'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        rapport_fichiers:
            uri_prefix: /uploads/rapports
            upload_destination: '%kernel.project_dir%/public/uploads/rapports'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        partenaire_logos:
            uri_prefix: /uploads/partenaires
            upload_destination: '%kernel.project_dir%/public/uploads/partenaires'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
